        # maxUnit: 30
        # tailChars: 4000
        # v2 判据（短句轮换 / 英文碎片），默认开；关掉它 = 退回只用第一把尺子
        # rotationGuard: true
        # shortShareMin: 0.35
        # topUnitShareMin: 0.50
